<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Login</title>
    <!-- fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <!-- style css -->
    <link rel="stylesheet" href="style.css?v=4">
</head>

<body class="loginPage">

    <!-- باکس اصلی فرم لاگین -->
    <div class="loginContainer">
        <!-- هدر فرم لاگین با رنگ تم اصلی شما -->
        <div class="loginHeader">
            <i class="fab fa-apple loginLogo"></i>
            <h2>Admin Portal Login</h2>
            <p>Enter your credentials to access the panel</p>
        </div>

        <form id="loginForm" class="loginForm">

            <!-- فیلد ایمیل -->
            <div class="loginField">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" placeholder="admin@example.com" required>
            </div>

            <!-- فیلد رمز عبور همراه با آیکون چشم -->
            <div class="loginField">
                <label for="loginPassword">Password</label>
                <div class="passwordWrapper">
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                    <i class="fas fa-eye togglePassword"></i>
                </div>
            </div>

            <!-- دکمه ورود هماهنگ با تم سبز شما -->
            <button type="submit" class="loginButton">Sign In</button>
        </form>
    </div>

    <!-- SweetAlert2 local bundle for offline use -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.26.25/sweetalert2.all.min.js"></script>
    <!-- متصل کردن فایل اسکریپت اصلی -->
    <script src="app.js?v=2"></script>
</body>

</html>
