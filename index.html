<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin panel</title>
    <!-- fontawesome -->
    <link rel="stylesheet" href="fontawesome-free-7.2.0-web/css/all.min.css">
    <!-- style css -->
    <link rel="stylesheet" href="style.css?v=4">
</head>

<body>
    <!--------------------- navigation ----------------------->
    <div class="container">
        <div class="navigation">
            <ul>
                <li>
                    <a href="#">
                        <span class="icon">
                            <i class="fab fa-apple"></i>
                        </span>
                        <span class="title">Brand Name </span>
                    </a>
                </li>
                <li>
                    <a href="index.html">
                        <span class="icon">
                            <i class="fas fa-home"></i>
                        </span>
                        <span class="title">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="customer.html">
                        <span class="icon">
                            <i class="fas fa-users"></i>
                        </span>
                        <span class="title">Customers</span>
                    </a>
                </li>
                <li>
                    <a href="message.html">
                        <span class="icon">
                            <i class="far fa-comment-alt"></i>
                        </span>
                        <span class="title">Message</span>
                    </a>
                </li>
                <li>
                    <a href="help.html">
                        <span class="icon">
                            <i class="fas fa-question"></i>
                        </span>
                        <span class="title">Help</span>
                    </a>
                </li>
                <li>
                    <a href="setting.html">
                        <span class="icon">
                            <i class="fas fa-cog"></i>
                        </span>
                        <span class="title">Setting</span>
                    </a>
                </li>
                <li>
                    <a href="setting.html">
                        <span class="icon">
                            <i class="fas fa-lock"></i>
                        </span>
                        <span class="title">Password</span>
                    </a>
                </li>
                <li>
                    <a href="#logoutModal" data-modal="logoutModal">
                        <span class="icon">
                            <i class="fas fa-sign-out"></i>
                        </span>
                        <span class="title">Sign Out</span>
                    </a>
                </li>
            </ul>
        </div>

        <!------------------- Main -------------- -->
        <div class="main">
            <div class="topbar">
                <div class="toggle">
                    <i class="fa-solid fa-toggle-on"></i>
                </div>

                <div class="search">
                    <label>
                        <input type="text" placeholder="search here">
                        <i class="fas fa-search"></i>
                    </label>
                </div>

                <div class="user">
                    <img src="assets/1.png" alt="">
                </div>
            </div>

            <!--------------------- cardBox ----------------------------->
            <!--------------------- cardBox ----------------------------->
            <div class="cardBox">
                <div class="cards">
                    <div>
                        <!-- اضافه شدن آی‌دی برای بازدید روزانه -->
                        <div class="numbers" id="statViews">0</div>
                        <div class="cardName">Daily views</div>
                    </div>
                    <div class="iconBox"><i class="fas fa-eye"></i></div>
                </div>
                <div class="cards">
                    <div>
                        <!-- اضافه شدن آی‌دی برای تعداد فروش -->
                        <div class="numbers" id="statSales">0</div>
                        <div class="cardName">Sales</div>
                    </div>
                    <div class="iconBox"><i class="fas fa-shopping-cart"></i></div>
                </div>
                <div class="cards">
                    <div>
                        <!-- اضافه شدن آی‌دی برای نظرات -->
                        <div class="numbers" id="statComments">0</div>
                        <div class="cardName">Comments</div>
                    </div>
                    <div class="iconBox"><i class="far fa-comment-alt"></i></div>
                </div>
                <div class="cards">
                    <div>
                        <!-- اضافه شدن آی‌دی برای درآمد کل -->
                        <div class="numbers" id="statEarning">$0</div>
                        <div class="cardName">Earning</div>
                    </div>
                    <div class="iconBox"><i class="fa fa-money-bill"></i></div>
                </div>
            </div>


            <!------------------Orders details List ---------------------- -->
            <div class="ditails">
                <div class="recentOrders">
                    <div class="cardHeader">
                        <h2>Recent Orders</h2>
                        <a href="#" class="btn">View All</a>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <td>Name</td>
                                <td>Price</td>
                                <td>Payment</td>
                                <td>Status</td>
                                <td>Action</td>
                            </tr>
                        </thead>

                        <tbody id="ordersTableBody">
                            <!-- ..... -->
                        </tbody>
                    </table>
                </div>

                <!-- New Customers -->

                <div class="recentCustomers">
                    <div class="cardHeader">
                        <h2>Recent Customers</h2>
                    </div>

                    <table>
                        <tbody id="recentCustomersList">
                            <!-- این بخش به صورت پویا با جاوا اسکریپت پر می‌شود -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <!-- پاپ آپ تایید خروج -->
    <div id="logoutModal" class="modal">
        <div class="modal-content">
            <h3>Sign Out</h3>
            <p>Are you sure you want to log out of the admin panel?</p>
            <div class="modal-buttons">
                <a href="index.html" class="modal-btn confirm-btn">Yes, Log out</a>
                <button id="closeModal" class="modal-btn cancel-btn">Cancel</button>
            </div>
        </div>
    </div>


    <!-- file js -->
    <script src="app.js?v=2"></script>
</body>

</html>
