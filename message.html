<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Messages</title>
    <!-- fontawesome -->
    <link rel="stylesheet" href="fontawesome-free-7.2.0-web/css/all.min.css">
    <!-- style css -->
    <link rel="stylesheet" href="style.css?v=4">
</head>

<body>
    <div class="container">
        <!--------------------- navigation ----------------------->
        <div class="navigation">
            <ul>
                <li>
                    <a href="#">
                        <span class="icon">
                            <i class="fab fa-apple"></i>
                        </span>
                        <span class="title">Brand Name </span>
                    </a>
                </li>
                <li>
                    <a href="index.html">
                        <span class="icon">
                            <i class="fas fa-home"></i>
                        </span>
                        <span class="title">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="customer.html">
                        <span class="icon">
                            <i class="fas fa-users"></i>
                        </span>
                        <span class="title">Customers</span>
                    </a>
                </li>
                <li>
                    <a href="message.html">
                        <span class="icon">
                            <i class="far fa-comment-alt"></i>
                        </span>
                        <span class="title">Message</span>
                    </a>
                </li>
                <li>
                    <a href="help.html">
                        <span class="icon">
                            <i class="fas fa-question"></i>
                        </span>
                        <span class="title">Help</span>
                    </a>
                </li>
                <li>
                    <a href="setting.html">
                        <span class="icon">
                            <i class="fas fa-cog"></i>
                        </span>
                        <span class="title">Setting</span>
                    </a>
                </li>
                <li>
                    <a href="setting.html">
                        <span class="icon">
                            <i class="fas fa-lock"></i>
                        </span>
                        <span class="title">Password</span>
                    </a>
                </li>
                <li>
                    <a href="#logoutModal" data-modal="logoutModal">
                        <span class="icon">
                            <i class="fas fa-sign-out"></i>
                        </span>
                        <span class="title">Sign Out</span>
                    </a>
                </li>
            </ul>
        </div>

        <!------------------- Main -------------- -->
        <div class="main">
            <div class="topbar">
                <div class="toggle">
                    <i class="fa-solid fa-toggle-on"></i>
                </div>

                <div class="search">
                    <label>
                        <input type="text" placeholder="Search messages...">
                        <i class="fas fa-search"></i>
                    </label>
                </div>

                <div class="user">
                    <img src="assets/1.png" alt="">
                </div>
            </div>

            <!------------------ Message Layout ---------------------- -->
            <div class="messageContainer">
                <!-- سمت چپ: لیست چت‌ها -->
                <div class="messageSidebar">
                    <h2>Inbox</h2>
                    <div class="chatList" id="chatListContainer">

                    </div>
                </div>

                <!-- سمت راست: باکس گفتگو -->
                <div class="messageBox">
                    <div class="messageHeader" id="activeChatHeader">

                    </div>

                    <div class="messageBody" id="chatMessageBody">

                    </div>

                    <div class="messageFooter">
                        <input type="text" id="msgInput" placeholder="Type a message...">
                        <button class="sendBtn" id="sendMsgBtn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div id="logoutModal" class="modal">
        <div class="modal-content">
            <h3>Sign Out</h3>
            <p>Are you sure you want to log out of the admin panel?</p>
            <div class="modal-buttons">
                <a href="index.html" class="modal-btn confirm-btn">Yes, Log out</a>
                <button id="closeModal" class="modal-btn cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- js script -->
    <script src="app.js?v=2"></script>
</body>

</html>
